# --- Server Configuration ---
appium.url=http://127.0.0.1:4723
appium.ip=127.0.0.1
appium.port=4723

# --- Device Configuration ---
# Debe coincidir exactamente con el nombre en tu AVD Manager
emulator.name=Automation_Device
platform.name=Android
platform.version=12.0
automation.name=UiAutomator2

# --- App Configuration ---
app.path=${user.dir}/src/test/resources/apps/tu-app.apk
app.package=com.ejemplo.app
app.activity=.MainActivity

# --- Timeouts (Optimizado para evitar Flakiness en emuladores) ---
# Los emuladores requieren más tiempo que los físicos para responder
timeout.explicit=20
timeout.device.ready=120
timeout.app.install=60

# --- Advanced Options ---
# Resetear la app entre tests o mantener el estado
no.reset=false
full.reset=false
